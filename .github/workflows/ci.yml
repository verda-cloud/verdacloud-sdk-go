name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Linting and code quality checks
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # golangci-lint version is pinned in the Makefile (GOLANGCI_LINT_VERSION)
      - name: Run linters
        run: make lint

  # Unit tests with coverage
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: make test

      - name: Generate coverage report
        run: make coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./build/coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Build verification
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build SDK
        run: make build

      - name: Vet integration tests (compile only, no credentials)
        run: make vet-integration

  # Apache 2.0 file headers on all *.go files
  license:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check license headers
        run: make license-check

  # Code formatting check
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          make fmt
          if [ -n "$(git status --porcelain)" ]; then
            echo "Code is not formatted. Please run 'make fmt'"
            git diff
            exit 1
          fi

  # Go mod tidy check
  mod-tidy:
    name: Go Mod Tidy Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check go mod tidy
        run: |
          make mod-tidy
          if [ -n "$(git status --porcelain)" ]; then
            echo "go.mod or go.sum is not tidy. Please run 'make mod-tidy'"
            git diff
            exit 1
          fi

  # go fix modernizers: fail if any fix is pending (go fix -diff exits non-zero)
  go-fix:
    name: Go Fix Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check for pending go fix changes
        run: make fix-check

  # Vulnerability scanning with govulncheck
  vuln-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck (fails on vulnerabilities not accepted in scripts/govulncheck-gate.sh)
        run: make vulncheck

  # E2E tests (focused subset: instance, serverless container, serverless job)
  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45 # Allow enough time for cloud resource provisioning
    # Only run if secrets are available (secrets are empty strings for fork PRs)
    env:
      VERDA_CLIENT_ID: ${{ secrets.VERDA_CLIENT_ID }}
      VERDA_CLIENT_SECRET: ${{ secrets.VERDA_CLIENT_SECRET }}
      VERDA_BASE_URL: ${{ secrets.VERDA_BASE_URL }}
    steps:
      - name: Check if secrets are available
        id: check-secrets
        run: |
          if [ -n "$VERDA_CLIENT_ID" ] && [ -n "$VERDA_CLIENT_SECRET" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
            echo "✅ API credentials available - e2e tests will run"
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "⚠️ API credentials not available - e2e tests will be skipped"
            echo "This is expected for PRs from forks. Tests will run after merge."
          fi

      - name: Checkout code
        if: steps.check-secrets.outputs.available == 'true'
        uses: actions/checkout@v6

      - name: Set up Go
        if: steps.check-secrets.outputs.available == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run smoke tests
        if: steps.check-secrets.outputs.available == 'true'
        run: make test-smoke

  # Prevent manual CHANGELOG.md edits (auto-generated by git-cliff at release time)
  changelog-guard:
    name: Changelog Guard
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - name: Check for CHANGELOG.md changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHANGED_FILES=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files --jq '.[].filename')
          if echo "$CHANGED_FILES" | grep -q '^CHANGELOG.md$'; then
            echo "::error::CHANGELOG.md should not be modified manually. It is auto-generated by git-cliff at release time."
            echo ""
            echo "Please revert your changes to CHANGELOG.md."
            echo "The changelog is generated automatically from conventional commit messages (feat:, fix:, chore:, etc.)."
            exit 1
          fi
          echo "✅ CHANGELOG.md not modified — all good."

  # All checks passed - used for branch protection
  ci-success:
    name: All CI Checks Passed
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, test, build, format, mod-tidy, go-fix, vuln-scan, license, changelog-guard]
    steps:
      - name: Check results
        run: |
          # changelog-guard is skipped on push events, which is fine
          for result in "${{ needs.lint.result }}" "${{ needs.test.result }}" "${{ needs.build.result }}" "${{ needs.format.result }}" "${{ needs.mod-tidy.result }}" "${{ needs.go-fix.result }}" "${{ needs.vuln-scan.result }}" "${{ needs.license.result }}"; do
            if [ "$result" != "success" ]; then
              echo "One or more CI checks failed"
              exit 1
            fi
          done
          # changelog-guard only runs on PRs, allow skipped
          if [ "${{ needs.changelog-guard.result }}" != "success" ] && [ "${{ needs.changelog-guard.result }}" != "skipped" ]; then
            echo "Changelog guard failed"
            exit 1
          fi
          echo "All CI checks passed successfully!"
