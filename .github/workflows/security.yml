name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run security scan every Monday at 9:00 AM UTC
    - cron: "0 9 * * 1"

jobs:
  gosec:
    name: Security Scan (gosec via golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # golangci-lint version is pinned in the Makefile (GOLANGCI_LINT_VERSION)
      - name: Run gosec via golangci-lint
        run: make gosec
